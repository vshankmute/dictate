<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#62D8FF"/>
      <stop offset="0.55" stop-color="#2E8BFF"/>
      <stop offset="1" stop-color="#1C45D6"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0.0" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="glyphShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A2470" flood-opacity="0.30"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)" clip-path="url(#body)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <g filter="url(#glyphShadow)" stroke-linecap="round" fill="none">
    <!-- sound waves -->
    <path d="M 716.8 271.6 A 250 250 0 0 1 716.8 558.4" stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="34"/>
    <path d="M 774.1 231.5 A 320 320 0 0 1 774.1 598.5" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="34"/>
    <path d="M 307.2 271.6 A 250 250 0 0 0 307.2 558.4" stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="34"/>
    <path d="M 249.9 231.5 A 320 320 0 0 0 249.9 598.5" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="34"/>
    <!-- microphone -->
    <rect x="410" y="232" width="204" height="352" rx="102" fill="#FFFFFF" stroke="none"/>
    <path d="M 352 468 A 160 160 0 0 0 672 468" stroke="#FFFFFF" stroke-width="44"/>
    <path d="M 512 628 L 512 728" stroke="#FFFFFF" stroke-width="44"/>
    <path d="M 420 750 L 604 750" stroke="#FFFFFF" stroke-width="44"/>
